name: Map Editor CI

on:
  push:
    branches:
      - "**"
    paths:
      - "apps/map-editor/**"
      - "database/migrations/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/map-editor-ci.yml"
  pull_request:
    paths:
      - "apps/map-editor/**"
      - "database/migrations/**"
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - ".github/workflows/map-editor-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Map Editor tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/map-editor

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/map-editor/package.json

      - name: Install dependencies
        run: npm install

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Next.js build
        run: npm run build

      - name: Run Vitest
        run: npm test

  atomic-save-slot-sql:
    name: Atomic Save Slot PostgreSQL fixture contract tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vendrith_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vendrith_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: vendrith_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create isolated stub fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/atomic-save-slot-fixture.sql
      - name: Apply candidate RPC to disposable database only
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261011220000_map_editor_atomic_game_save_slot_v1.sql
      - name: Assert atomic success and rollback behavior
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/atomic-save-slot-assertions.sql
      - name: Assert concurrent saves serialize and conflict
        run: bash supabase/tests/atomic-save-slot-concurrency.sh

  atomic-save-slot-full-schema:
    name: Atomic Save Slot reconstructed full-schema integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vendrith_full_schema_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vendrith_full_schema_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5433
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: vendrith_full_schema_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare isolated Supabase auth compatibility
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/atomic-save-slot-full-schema-bootstrap.sql
      - name: Apply reconstructed schema without unavailable Supabase Vault extension
        shell: bash
        run: |
          set -o pipefail
          sed '/CREATE EXTENSION IF NOT EXISTS "supabase_vault"/d' supabase/migrations/20261003170000_remote_schema_baseline_reconstructed.sql | psql -v ON_ERROR_STOP=1
      - name: Apply candidate private Save Slot schema to disposable full-schema database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261010190000_map_editor_private_save_slots_v1.sql
      - name: Apply candidate Save Slot RPC to disposable full-schema database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261011220000_map_editor_atomic_game_save_slot_v1.sql
      - name: Apply candidate validated Load Slot RPC to disposable full-schema database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261012200000_map_editor_load_save_slot_validated_v1.sql
      - name: Apply candidate Load Slot Terrain V2 validation to disposable full-schema database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261022150000_map_editor_load_slot_terrain_semantics_v1.sql
      - name: Apply authenticated NPC Creator runtime contract persistence to disposable full-schema database
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261022170000_npc_creator_runtime_contract_overrides_v1.sql
      - name: Assert NPC Creator runtime contract ownership and RLS
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/npc-creator-runtime-contract-overrides-assertions.sql
      - name: Create isolated test helpers and failure injection triggers
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/atomic-save-slot-full-schema-support.sql
      - name: Assert validated Load Slot integrity contract
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/atomic-load-slot-validated-assertions.sql
      - name: Assert real RPC and schema integration
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/atomic-save-slot-full-schema-assertions.sql
      - name: Assert full-schema concurrent save serialization
        run: bash supabase/tests/atomic-save-slot-full-schema-concurrency.sh

  world-hierarchy-persistence-sql:
    name: World hierarchy PostgreSQL persistence integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vendrith_hierarchy_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vendrith_hierarchy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5434
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: vendrith_hierarchy_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Prepare isolated Supabase auth compatibility
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/atomic-save-slot-full-schema-bootstrap.sql
      - name: Apply reconstructed schema to disposable PostgreSQL only
        shell: bash
        run: |
          set -o pipefail
          sed '/CREATE EXTENSION IF NOT EXISTS "supabase_vault"/d' supabase/migrations/20261003170000_remote_schema_baseline_reconstructed.sql | psql -v ON_ERROR_STOP=1
      - name: Apply world hierarchy materialization RPC
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261023120000_map_editor_materialize_world_hierarchy_v1.sql
      - name: Assert atomic 4 Region + 16 Playable persistence, snapshot read-back contract, and retry protection
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/world-hierarchy-persistence.sql

  runtime-persistence-sql:
    name: AI Runtime Persistence PostgreSQL contract tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vendrith_runtime_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vendrith_runtime_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5434
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: vendrith_runtime_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create isolated runtime auth and map fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/runtime-persistence-fixture.sql
      - name: Apply prior mutation lookup migration
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/20261009015100_vendrith_runtime_mutation_lookup_v1.sql
      - name: Apply runtime persistence migration to disposable database
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/20261009015200_vendrith_runtime_persistence_v1.sql
      - name: Assert lease, ownership, idempotency, rollback, checkpoint, and recovery reads
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/runtime-persistence-assertions.sql
      - name: Assert concurrent appends serialize sequence allocation
        run: bash supabase/tests/runtime-persistence-concurrency.sh

  ai-session-approval-sql:
    name: AI session ownership and approval audit PostgreSQL contract tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vendrith_ai_session_test
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vendrith_ai_session_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5436
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: vendrith_ai_session_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create isolated auth fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/ai-session-approval-fixture.sql
      - name: Assert session ownership and durable approval/audit contracts
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/ai-session-approval-assertions.sql

  runtime-intent-reconciliation-sql:
    name: AI Runtime Intent Reconciliation PostgreSQL contract tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vendrith_runtime_intent_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vendrith_runtime_intent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: 5435
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: vendrith_runtime_intent_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create isolated runtime auth, map, and intent fixture
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/runtime-intent-reconciliation-fixture.sql
      - name: Apply runtime intent queue migration to disposable database
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/20261009013000_vendrith_runtime_intents_v1.sql
      - name: Apply runtime intent consumer migration to disposable database
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/20261009014000_vendrith_runtime_intent_consumer_v1.sql
      - name: Apply prior mutation lookup migration
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/20261009015100_vendrith_runtime_mutation_lookup_v1.sql
      - name: Apply runtime persistence migration to disposable database
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/20261009015200_vendrith_runtime_persistence_v1.sql
      - name: Apply runtime intent reconciliation migration to disposable database
        run: psql -v ON_ERROR_STOP=1 -f database/migrations/20261009015300_vendrith_runtime_intent_reconciliation_v1.sql
      - name: Assert interrupted runtime intents reconcile only from verified journal
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/runtime-intent-reconciliation-assertions.sql
