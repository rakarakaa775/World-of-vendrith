name: Vendrith World Builder Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-world-builder:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/map-editor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/map-editor/package.json

      - name: Install dependencies
        run: npm install

      - name: Run World Builder focused tests
        run: npm test
